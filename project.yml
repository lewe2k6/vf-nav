name: VFSwapNavigator
options:
  bundleIdPrefix: vn.vfswap
  xcodeVersion: "15.0"
targets:
  VFSwapNavigator:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: VFSwapNavigator
    info:
      path: VFSwapNavigator/Info.plist
      properties:
        CFBundleDevelopmentRegion: vi
        CFBundleDisplayName: "VFSwap Radar"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "3.0.0"
        CFBundleVersion: "5"
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UIViewControllerBasedStatusBarAppearance: true
        UILaunchStoryboardName: LaunchScreen
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        LSApplicationQueriesSchemes:
          - comgooglemaps
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "Ứng dụng cần GPS chính xác để tìm tủ đổi pin gần nhất và tự động canh pin mỗi 3 giây khi bạn đang mở Google Maps."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Ứng dụng cần vị trí GPS để tự động kiểm tra tủ pin mỗi 3 giây."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.vfswap.navigator3d
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: VFSwapNavigator/Info.plist
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_BITCODE: NO
